name: setup-node-yarn
description: Install Node.js and activate Yarn through Corepack.

inputs:
  node-version:
    required: false
    default: "22"
  registry-url:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        # setup-node v5 caches for the `packageManager` in package.json on
        # its own, by running the global Yarn 1, before Corepack is enabled.
        package-manager-cache: false
    - shell: bash
      run: corepack enable
