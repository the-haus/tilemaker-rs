name: setup-node-yarn
description: Install Node.js and activate Yarn through Corepack.

inputs:
  node-version:
    required: false
    default: "22"
  registry-url:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - shell: bash
      run: corepack enable
