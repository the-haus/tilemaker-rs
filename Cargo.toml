[workspace]
members = [
    "crates/tilemaker-geom",
    "crates/tilemaker-pbf",
    "crates/tilemaker-store",
    "crates/tilemaker-config",
    "crates/tilemaker-mvt",
    "crates/tilemaker-output",
    "crates/tilemaker-lua",
    "crates/tilemaker-core",
    "crates/tilemaker-export",
    "crates/tilemaker-cli",
    "crates/bindings/tilemaker-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "FTWPL"
repository = "https://github.com/systemed/tilemaker"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
tilemaker-geom = { path = "crates/tilemaker-geom", version = "=0.1.0" }
tilemaker-pbf = { path = "crates/tilemaker-pbf", version = "=0.1.0" }
tilemaker-store = { path = "crates/tilemaker-store", version = "=0.1.0" }
tilemaker-config = { path = "crates/tilemaker-config", version = "=0.1.0" }
tilemaker-mvt = { path = "crates/tilemaker-mvt", version = "=0.1.0" }
tilemaker-output = { path = "crates/tilemaker-output", version = "=0.1.0" }
tilemaker-lua = { path = "crates/tilemaker-lua", version = "=0.1.0", default-features = false }
tilemaker-core = { path = "crates/tilemaker-core", version = "=0.1.0", default-features = false }
tilemaker-export = { path = "crates/tilemaker-export", version = "=0.1.0" }

# External crates.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1"
crossbeam-channel = "0.5"
geo = "0.33"
polylabel = "3"
rstar = "0.12"
rustc-hash = "2"
mlua = { version = "0.12", features = ["vendored"] }
rusqlite = { version = "0.40", features = ["bundled"] }
memmap2 = "0.9"
libdeflater = "1"
zstd = { version = "0.13", default-features = false }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1
